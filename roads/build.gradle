plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'village-roads'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Millénaire is optional at run time (the village network); its jar is supplied locally, never bundled
def millenaireJar = file(project.millenaire_jar)
if (!millenaireJar.exists()) {
    throw new GradleException("Missing ${millenaireJar}. Place the official Millénaire jar there (see ../README.md).")
}

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files(millenaireJar)

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Plain-JVM unit tests of the planner (dev.villageroads.plan is pure: no game classes)
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
