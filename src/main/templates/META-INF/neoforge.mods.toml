modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: if present, the version must match what was audited. If absent, the
# corresponding integration disables itself.
[[dependencies.${mod_id}]]
    modId="millenaire"
    type="optional"
    versionRange="${millenaire_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="hundred_years_war"
    type="optional"
    versionRange="${hyw_version_range}"
    ordering="AFTER"
    side="BOTH"
